---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_2_2_2 }}
file:
  journald_syslog:
    title: 6.2.2.2 | Ensure journald is configured to send logs to rsyslog
    path: /etc/systemd/journald.conf
    exists: true
    contents:
    - '/^ForwardToSyslog=yes/'
    - '!/ForwardToSyslog=[Nn][Oo]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.2
      CISv8:
      - 8.2
      - 8.9
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-6
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
